<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Rubik+Glitch&display=swap"
      rel="stylesheet"
    />
    <title>Sorting visualizer</title>
  </head>
  <body>
    <h1 class="title">
      Sorting Algorithm <span class="title-secondary">Visualizer</span>
    </h1>

    <div class="controls-panel border">
      <div class="controls-toolbar">
        <div class="control-field">
          <label class="control-label" for="sampleSize">
            Sample size
            <span class="control-value" id="sampleSizeValue" aria-live="polite">20</span>
          </label>
          <div class="range-row">
            <span class="range-hint">small</span>
            <input
              id="sampleSize"
              class="range range--sample-size"
              type="range"
              min="6"
              max="50"
              step="1"
              value="20"
            />
            <span class="range-hint">large</span>
          </div>
        </div>

        <div class="control-field">
          <label class="control-label" for="stepDelay">
            Speed
            <span class="control-unit">(ms)</span>
            <span class="control-value" id="stepDelayValue" aria-live="polite">1000</span>
          </label>
          <div class="range-row">
            <span class="range-hint">fast</span>
            <input
              id="stepDelay"
              class="range range--step-delay"
              type="range"
              min="50"
              max="2000"
              step="10"
              value="1000"
            />
            <span class="range-hint">slow</span>
          </div>
        </div>

        <div class="control-field control-field--algo">
          <label class="control-label" for="algorithm">Sort method</label>
          <select class="select-input border" name="algorithm" id="algorithm">
            <option class="option" value="none">— Pick one —</option>
            <option class="option" value="selection">Selection sort</option>
            <option class="option" value="bubble">Bubble sort</option>
            <option class="option" value="merge">Merge sort</option>
            <option class="option" value="insertion">Insertion sort</option>
          </select>
        </div>

        <div class="controls-actions">
          <button type="button" class="button button--run">Run</button>
          <button type="button" class="button button--random-data">Random data</button>
          <button type="button" class="button button--reset-all" disabled>
            Reset
          </button>
        </div>
      </div>
    </div>

    <canvas
      class="canvas border"
      id="barChart"
      width="1000"
      height="500"
    ></canvas>
    <p class="legend" role="region" aria-label="Legend and complexity"></p>

    <script type="module" src="./index.js"></script>
  </body>
</html>
